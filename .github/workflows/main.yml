name: Test

# 生产流水线不在 Actions 上跑：bj-edge 的 fcm-hosts-next.timer 执行 scripts/publish.sh。
# 这里只在代码改动时跑测试；采集与实测必须在大陆双栈网络里做，不能放到 GitHub 托管机器上。

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Lint publish script
        run: shellcheck scripts/publish.sh
